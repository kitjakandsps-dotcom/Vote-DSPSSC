  .ttl{flex:1;min-width:0;line-height:1.2}
  .ttl b{display:block;font-size:1.55em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ttl small{display:block;color:#a9c0b2;font-size:.95em}
  .spill{display:inline-flex;align-items:center;gap:.55em;height:2.3em;padding:0 1em;border-radius:999px;background:rgba(255,255,255,.09);font-weight:700;font-size:.95em;white-space:nowrap}
  .spill i{width:.6em;height:.6em;border-radius:50%;background:#a9c0b2}
  .spill.OPEN{background:var(--gold);color:var(--g9)}.spill.OPEN i{background:var(--g9);animation:blink 1.4s infinite}
  .spill.PAUSED{background:#ff7a6e;color:#3b0905}.spill.PAUSED i{background:#3b0905}
  .spill.SEALED{background:#ffd75e;color:#3b2a05}.spill.SEALED i{background:#3b2a05}
  .spill.FINAL{background:#fff;color:var(--g9)}.spill.FINAL i{background:var(--gold)}
  @keyframes blink{50%{opacity:.25}}
  .clock{font-size:1.5em;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .off{color:#ffb4ab;font-size:.85em;font-weight:600}
  footer.ft{padding:.7em 2em 1em;color:#7f9b8a;font-size:.8em;display:flex;gap:1em;justify-content:space-between;flex-wrap:wrap}

  /* ยอดผู้มาใช้สิทธิ์ */
  .tgrid{flex:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.4em;padding:.6em 2em 0}
  .hero{background:linear-gradient(160deg,#145232,#0f442a);border-radius:1.6em;padding:2em 2.2em;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .hero::after{content:"";position:absolute;right:-6em;bottom:-7em;width:22em;height:22em;border-radius:50%;border:3.2em solid rgba(242,183,5,.07)}
  .hero .k{font-size:1.15em;color:#cfe0d5;font-weight:600}
  .hero .big{font-size:clamp(64px,9.2vw,190px);font-weight:700;line-height:.95;letter-spacing:-.03em;margin-top:.12em}
  .hero .of{font-size:1.5em;color:#a9c0b2;font-weight:600;margin-top:.25em}
  .hero .of b{color:#fff}
  .meter{height:1.1em;border-radius:99px;background:rgba(255,255,255,.1);margin-top:1.6em;position:relative;overflow:hidden}
  .meter i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .meter span{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.35)}
  .pctrow{display:flex;align-items:baseline;justify-content:space-between;margin-top:.5em;color:#a9c0b2;font-size:.95em}
  .pctrow b{font-size:2.6em;color:var(--gold);line-height:1;font-weight:700}
  .chips{display:flex;gap:.7em;flex-wrap:wrap;margin-top:auto;padding-top:1.6em;position:relative;z-index:1}
  .chip{background:rgba(255,255,255,.08);border-radius:1em;padding:.7em 1.1em;line-height:1.25}
  .chip small{display:block;color:#a9c0b2;font-size:.85em}
  .chip b{font-size:1.5em}
  .note{margin-top:1.2em;background:rgba(242,183,5,.13);color:var(--gold);border-radius:1em;padding:.8em 1.1em;font-weight:700;font-size:1.1em;position:relative;z-index:1}
  .side{display:grid;grid-template-rows:auto auto 1fr;gap:1.1em;min-width:0}
  .box{background:rgba(255,255,255,.055);border-radius:1.3em;padding:1.1em 1.4em 1.2em}
  .box h3{margin:0 0 .65em;font-size:1em;color:#a9c0b2;font-weight:700;display:flex;justify-content:space-between}
  .rowb{display:grid;grid-template-columns:7.2em minmax(0,1fr) 6.4em;gap:.9em;align-items:center;padding:.36em 0}
  .rowb .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rowb .n i{display:inline-block;width:.7em;height:.7em;border-radius:3px;margin-right:.45em;background:var(--c)}
  .rowb .tr{height:.8em;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
  .rowb .tr i{display:block;height:100%;border-radius:99px;background:var(--c,var(--gold));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .rowb .v{text-align:right;font-weight:700;white-space:nowrap}
  .rowb .v small{color:#a9c0b2;font-weight:600;margin-left:.3em}
  .levels{display:grid;grid-template-columns:repeat(var(--n,6),minmax(0,1fr));gap:.7em;align-items:end;height:calc(100% - 2em);min-height:9em}
  .lv{display:flex;flex-direction:column;align-items:center;gap:.35em;height:100%;justify-content:flex-end}
  .lv .col{width:100%;max-width:4.2em;flex:1;border-radius:.6em;background:rgba(255,255,255,.08);position:relative;overflow:hidden;min-height:5em}
  .lv .col i{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(#f7cb3b,var(--gold));transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
  .lv.tch .col{background:transparent;border:2px dashed rgba(255,255,255,.28)}
  .lv.tch .col i{background:rgba(255,255,255,.82)}
  .lv b{font-size:1.15em}
  .lv small{color:#a9c0b2;font-size:.85em;line-height:1}
  .lv .p{font-weight:700;font-size:.95em}

  /* ประกาศผล */
  .stage{flex:1;position:relative;padding:.4em 2em 0;display:flex;flex-direction:column}
  .page{flex:1;display:flex;flex-direction:column;animation:fin .55s ease}
  @keyframes fin{from{opacity:0;transform:translateY(14px)}}
  .ptitle{display:flex;align-items:center;gap:.8em;margin-bottom:1em}
  .ptitle .tag{background:var(--pc,var(--gold));color:var(--pon,var(--g9));font-weight:700;border-radius:.6em;padding:.25em .8em;font-size:1em;white-space:nowrap}
  .ptitle h2{margin:0;font-size:2.1em;line-height:1.1}
  .ptitle .facts{margin-left:auto;display:flex;gap:1.5em;color:#a9c0b2;font-size:.95em;white-space:nowrap}
  .ptitle .facts b{color:#fff;font-size:1.15em;margin-left:.3em}
  .rgrid{flex:1;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.15fr);gap:1.6em;min-height:0}
  .win{background:#fff;color:var(--ink);border-radius:1.6em;overflow:hidden;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1fr);position:relative;border-top:.5em solid var(--pc,var(--g))}
  .win .ph{background:#e9ece6 center/cover no-repeat;position:relative;min-height:16em}
  .win .ph .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:7em;font-weight:700;color:rgba(0,0,0,.12)}
  .win .no{position:absolute;left:.5em;top:.5em;background:#fff;color:var(--ink);font-weight:700;font-size:2.6em;min-width:1.5em;height:1.5em;border-radius:.35em;display:grid;place-items:center;padding:0 .2em;box-shadow:0 .2em .6em rgba(0,0,0,.15)}
  .win .tx{padding:1.6em 1.6em 1.4em;display:flex;flex-direction:column;min-width:0}
  .win .badge{align-self:flex-start;background:var(--gold);color:var(--g9);font-weight:700;border-radius:.6em;padding:.35em .85em;font-size:1em;display:inline-flex;gap:.45em;align-items:center}
  .win .badge svg{width:1.15em;height:1.15em;stroke-width:2.6}
  .win .badge.wait{background:var(--soft);color:var(--muted)}
  .win .pt{color:var(--muted);font-weight:700;margin-top:1em;font-size:1.05em}
  .win .pn{font-size:2.2em;font-weight:700;line-height:1.15;margin-top:.1em}
  .win .vv{margin-top:auto;padding-top:1em}
  .win .vv b{font-size:4.4em;line-height:1;font-weight:700;letter-spacing:-.02em}
  .win .vv small{display:block;color:var(--muted);font-size:1.05em;font-weight:600;margin-top:.2em}
  .win.none{grid-template-columns:1fr;place-items:center;text-align:center;padding:2em}
  .win.none .big{font-size:2.2em;font-weight:700;line-height:1.25;max-width:16em}
  .win.none p{color:var(--muted);font-size:1.1em}
  .bars{background:rgba(255,255,255,.055);border-radius:1.6em;padding:1.3em 1.6em;display:flex;flex-direction:column;gap:.55em;min-width:0}
  .brow{display:grid;grid-template-columns:3em minmax(0,1fr) auto;gap:.9em;align-items:center;padding:.45em 0}
  .brow .bn{width:2.6em;height:2.6em;border-radius:.7em;background:var(--c);color:var(--on,#fff);display:grid;place-items:center;font-weight:700;font-size:1.25em}
  .brow .bw{min-width:0}
  .brow .bt{display:flex;justify-content:space-between;gap:1em;font-weight:700;font-size:1.1em}
  .brow .bt span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brow .bt small{color:#a9c0b2;font-weight:600;font-size:.82em;margin-left:.4em}
  .brow .tr{height:.95em;border-radius:99px;background:rgba(255,255,255,.08);margin-top:.35em;overflow:hidden}
  .brow .tr i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
  .brow .vt{text-align:right;line-height:1.1;min-width:5.5em}
  .brow .vt b{font-size:1.7em;font-weight:700}
  .brow .vt small{display:block;color:#a9c0b2;font-weight:600}
  .brow.top .bt span{color:var(--gold)}
  .brow.vn .bn{background:rgba(255,255,255,.12);color:#cfe0d5}
  .brow.vn .tr i{background:#7f9b8a}
  .bline{border-top:1px dashed rgba(255,255,255,.14);margin:.2em 0}
  .bfoot{margin-top:auto;padding-top:.7em;color:#a9c0b2;font-size:.9em;display:flex;gap:1.4em;flex-wrap:wrap}
  .bfoot b{color:#fff}

  /* 4 คณะสีในจอเดียว */
  .g4{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:1.1em;min-height:0}
  .gp{background:rgba(255,255,255,.055);border-radius:1.4em;overflow:hidden;display:flex;flex-direction:column;min-height:0}
  .gp .gh{background:var(--pc);color:var(--pon);padding:.6em 1.2em;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:1.15em}
  .gp .gh small{font-weight:600;opacity:.85;font-size:.8em}
  .gp .gb{display:grid;grid-template-columns:7.2em minmax(0,1fr);gap:1.1em;padding:1em 1.2em;flex:1;min-height:0}
  .gp .gw{background:#e9ece6 center/cover no-repeat;border-radius:1em;position:relative;min-height:8em;color:var(--ink)}
  .gp .gw .no{position:absolute;left:.35em;top:.35em;background:#fff;font-weight:700;border-radius:.4em;min-width:1.7em;height:1.7em;display:grid;place-items:center;font-size:1.2em}
  .gp .gw .ini{position:absolute;inset:0;display:grid;place-items:center;font-size:3em;font-weight:700;color:rgba(0,0,0,.12)}
  .gp .gr{min-width:0;display:flex;flex-direction:column}
  .gp .gr .wl{color:var(--gold);font-weight:700;font-size:.92em}
  .gp .gr .wn{font-size:1.45em;font-weight:700;line-height:1.2}
  .gp .gr .wp{color:#a9c0b2;font-size:.9em}
  .gp .mini{margin-top:auto;display:grid;gap:.3em}
  .gp .mb{display:grid;grid-template-columns:1.6em minmax(0,1fr) 3.4em;gap:.5em;align-items:center;font-size:.9em}
  .gp .mb b{text-align:right}
  .gp .mb .tr{height:.6em;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .gp .mb .tr i{display:block;height:100%;width:0;background:var(--pc);border-radius:99px;transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
  .gp .mb.on b,.gp .mb.on span{color:var(--gold)}

  .nav{display:flex;align-items:center;gap:.5em}
  .nav i{width:.7em;height:.7em;border-radius:50%;background:rgba(255,255,255,.22);transition:width .3s}
  .nav i.on{width:2em;border-radius:99px;background:var(--gold)}
  .nav .pp{margin-left:.4em;color:#a9c0b2;font-size:.85em}
  .ptimer{height:3px;background:rgba(255,255,255,.08);margin:.8em 0 0}
  .ptimer i{display:block;height:100%;background:var(--gold);width:0}
  .tapL,.tapR{position:fixed;top:15%;bottom:15%;width:18%;z-index:1}
  .tapL{left:0}.tapR{right:0}

  /* ---------- สถิติหลังปิดหีบ ---------- */
  .sgrid{flex:1;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:1.3em;padding:.4em 2em 0;min-height:0}
  .sbox{background:rgba(255,255,255,.055);border-radius:1.6em;padding:1.2em 1.5em;display:flex;flex-direction:column;min-height:0}
  .sbox h3{margin:0 0 .2em;font-size:1.35em;display:flex;justify-content:space-between;gap:1em;align-items:baseline;flex-wrap:wrap}
  .sbox h3 small{font-size:.68em;color:#a9c0b2;font-weight:600}
  .sday{display:flex;flex-direction:column;flex:1;min-height:0;margin-top:.6em}
  .sday + .sday{border-top:1px dashed rgba(255,255,255,.14);padding-top:.7em}
  .sday .t{color:#a9c0b2;font-size:.95em;display:flex;justify-content:space-between;gap:1em;flex-wrap:wrap}
  .sday .t b{color:#fff}
  .sch{flex:1;display:flex;align-items:flex-end;gap:.45em;min-height:6em;padding-top:1.6em}
  .sch .c{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0}
  .sch .c i{display:block;width:100%;max-width:3.4em;border-radius:.5em .5em .15em .15em;background:#5fd394;min-height:3px;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
  .sch .c.pk i{background:var(--gold)}
  .sch .c b{font-size:.95em;margin-bottom:.2em}
  .sch .c.pk b{color:var(--gold)}
  .sx{display:flex;gap:.45em;border-top:1px solid rgba(255,255,255,.14);padding-top:.35em}
  .sx span{flex:1;text-align:center;font-size:.8em;color:#a9c0b2;min-width:0}
  .speak{display:flex;gap:1em;margin-top:.9em;flex-wrap:wrap}
  .speak div{background:rgba(0,0,0,.2);border-radius:1em;padding:.55em 1em;line-height:1.25}
  .speak small{display:block;color:#a9c0b2;font-size:.8em;font-weight:600}
  .speak b{font-size:1.5em}.speak .g b{color:var(--gold)}
  .srk{display:flex;flex-direction:column;gap:.15em;margin-top:.5em;flex:1;min-height:0}
  .srk .r{display:grid;grid-template-columns:2em 5em minmax(0,1fr) 4.2em;gap:.7em;align-items:center;padding:.38em 0;border-top:1px solid rgba(255,255,255,.08)}
  .srk .r:first-child{border-top:0}
  .srk .k{font-weight:700;color:#a9c0b2;text-align:right}
  .srk .r.t1 .k{color:var(--gold)}
  .srk .n{font-weight:700;font-size:1.1em}
  .srk .tr{height:.65em;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .srk .tr i{display:block;height:100%;background:#5fd394;border-radius:99px;transition:width 1.2s}
  .srk .r.full .tr i{background:var(--gold)}
  .srk .p{text-align:right;font-weight:700;font-size:1.1em}
  .sfoot{color:#a9c0b2;font-size:.9em;margin-top:.6em}
  .sfoot b{color:#fff}
  .spg{position:fixed;left:50%;bottom:.75em;transform:translateX(-50%);display:flex;gap:.4em;z-index:3}
  .spg i{width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.25)}.spg i.on{background:var(--gold);width:1.6em;border-radius:99px}
  @media (max-width:900px){
    .sgrid{grid-template-columns:1fr;padding:4px 14px 0;gap:14px}
    .spg{display:none}
  }

  /* ---------- นับคะแนนสด ---------- */
  .spill.LIVE{background:#d8402f;color:#fff}.spill.LIVE i{background:#fff;animation:blink 1.1s infinite}
  .spill.DONE{background:#fff;color:var(--g9)}.spill.DONE i{background:#d8402f}
  .live{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);gap:.9em 1.3em;padding:.3em 2em 0;min-height:0}
  .lp{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.4em 1.4em;align-items:center}
  .lp .big{font-size:3.7em;font-weight:700;line-height:.9;letter-spacing:-.03em;color:var(--gold)}
  .lp .lab{line-height:1.2}
  .lp .lab b{display:block;font-size:1.35em}
  .lp .lab small{color:#a9c0b2;font-size:.95em}
  .lp .nx{text-align:right;line-height:1.15;color:#a9c0b2;font-size:.95em;white-space:nowrap}
  .lp .nx b{display:block;color:#fff;font-size:1.9em;font-variant-numeric:tabular-nums}
  .lp .nx.done b{font-size:1.25em;color:var(--gold)}
  .lseg{grid-column:1/-1;height:.75em;border-radius:99px;background:rgba(255,255,255,.09);display:flex;overflow:hidden}
  .lseg i{display:block;height:100%;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .lseg i + i{box-shadow:inset .18em 0 0 var(--g9)}
  .lkey{grid-column:1/-1;display:flex;gap:.3em 1.3em;flex-wrap:wrap;color:#a9c0b2;font-size:.85em;margin-top:-.5em}
  .lkey span{display:inline-flex;align-items:center;gap:.45em}.lkey i{width:.7em;height:.7em;border-radius:3px;background:var(--c)}
  .lpres{background:rgba(255,255,255,.055);border-radius:1.6em;padding:1em 1.4em .9em;display:flex;flex-direction:column;min-height:0;position:relative;transition:box-shadow .6s}
  .lpres.won{box-shadow:inset 0 0 0 .2em var(--gold)}
  .lhd{display:flex;align-items:center;gap:.8em;margin-bottom:.7em;flex-wrap:wrap}
  .lhd .tag{background:var(--gold);color:var(--g9);font-weight:700;border-radius:.6em;padding:.2em .75em;white-space:nowrap}
  .lhd h2{margin:0;font-size:1.7em;line-height:1.1}
  .lhd small{margin-left:auto;color:#a9c0b2;font-size:.95em;white-space:nowrap}
  .lhd small b{color:#fff}
  .lcs{display:flex;flex-direction:column;gap:.4em;flex:1;min-height:0;justify-content:center}
  .lc{display:grid;grid-template-columns:4.6em minmax(0,1fr) auto;gap:1em;align-items:center;padding:.55em .7em;border-radius:1.1em;transition:background .6s,opacity .6s}
  .lc .av{width:4.6em;height:4.6em;border-radius:1em;background:var(--c) center/cover no-repeat;position:relative;display:grid;place-items:center;font-weight:700;font-size:1em;color:var(--on)}
  .lc .av .ini{font-size:2em;opacity:.55}
  .lc .av .no{position:absolute;left:-.35em;top:-.35em;min-width:1.7em;height:1.7em;padding:0 .3em;border-radius:.55em;background:#fff;color:var(--g9);display:grid;place-items:center;font-size:.95em;box-shadow:0 .15em .4em rgba(0,0,0,.25)}
  .lc .bd{min-width:0}
  .lc .nm{display:flex;align-items:center;gap:.6em;min-width:0}
  .lc .nm b{font-size:1.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc .pt{color:#a9c0b2;font-size:.95em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lc .tr{height:1.05em;border-radius:99px;background:rgba(255,255,255,.08);margin-top:.45em;overflow:hidden}
  .lc .tr i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);filter:brightness(1.35) saturate(1.1);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .lc .vt{text-align:right;line-height:1.05;min-width:5.2em}
  .lc .vt b{font-size:2.5em;font-weight:700;letter-spacing:-.02em}
  .lc .vt small{display:block;color:#a9c0b2;font-weight:600;font-size:1.05em;margin-top:.15em}
  .lc.lead{background:rgba(255,255,255,.06)}
  .lc.lead .nm b{color:var(--gold)}
  .lc.won{background:linear-gradient(90deg,rgba(242,183,5,.22),rgba(242,183,5,.05))}
  .lc.won .nm b{color:var(--gold)}
  .lc.out{opacity:.45}
  .lb{flex-shrink:0;font-size:.85em;font-weight:700;border-radius:.45em;padding:.12em .6em;white-space:nowrap}
  .lb.lead{background:rgba(242,183,5,.18);color:var(--gold)}
  .lb.ok{background:var(--gold);color:var(--g9);display:inline-flex;align-items:center;gap:.35em}
  .lb.ok svg{width:1.05em;height:1.05em;stroke-width:3}
  .lb.fail{background:#ff7a6e;color:#3b0905}
  .lvn{display:flex;gap:1.4em;flex-wrap:wrap;color:#a9c0b2;font-size:.92em;padding:.6em .7em 0;border-top:1px dashed rgba(255,255,255,.14);margin-top:.5em}
  .lvn b{color:#fff}
  .lmg{margin:.2em .7em 0;padding:.6em .9em;border-radius:.9em;background:rgba(0,0,0,.18);font-weight:600;font-size:1.02em}
  .lmg b{color:var(--gold)}
  .lside{display:flex;flex-direction:column;gap:1em;min-width:0;min-height:0}
  .lsec h3{margin:0 0 .5em;font-size:.95em;color:#a9c0b2;font-weight:700;display:flex;justify-content:space-between}
  .lbx{display:grid;grid-template-columns:repeat(auto-fit,minmax(7.4em,1fr));gap:.6em}
  .bx{border-radius:1em;padding:.7em .85em .75em;background:rgba(255,255,255,.055);position:relative;overflow:hidden;transition:background .8s}
  .bx::before{content:"";position:absolute;inset:0 auto 0 0;width:.35em;background:var(--c,rgba(255,255,255,.18));transition:background .8s}
  .bx b{display:flex;align-items:center;gap:.45em;font-size:1.05em;line-height:1.2}
  .bx .dot{width:.65em;height:.65em;border-radius:3px;flex-shrink:0}
  .bx .bp{font-size:1.7em;font-weight:700;line-height:1.05;margin-top:.15em}
  .bx small{display:block;color:#a9c0b2;font-size:.82em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bx .bt{height:.4em;border-radius:99px;background:rgba(255,255,255,.1);margin-top:.45em;overflow:hidden}
  .bx .bt i{display:block;height:100%;width:0;background:#fff;opacity:.85;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .bx.ping{animation:ping 1.6s ease}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,183,5,.9)}100%{box-shadow:0 0 0 1.2em rgba(242,183,5,0)}}
  .lhs{display:grid;grid-template-columns:1fr 1fr;gap:.7em;flex:1;min-height:0;grid-auto-rows:1fr}
  .hs{background:rgba(255,255,255,.055);border-radius:1.1em;overflow:hidden;display:flex;flex-direction:column;min-height:0;position:relative}
  .hs .hh{background:var(--pc);color:var(--pon);padding:.35em .8em;display:flex;justify-content:space-between;align-items:center;font-weight:700;gap:.5em}
  .hs .hh small{font-weight:600;opacity:.85;font-size:.82em;white-space:nowrap}
  .hs .hb{padding:.55em .8em .65em;display:flex;flex-direction:column;gap:.3em;flex:1;min-height:0}
  .hs .hl{font-size:.82em;font-weight:700;color:#a9c0b2;min-height:1.4em;display:flex;align-items:center;gap:.4em}
  .hs .hl.ok{color:var(--gold)}.hs .hl.fail{color:#ff9d93}
  .hs .hl svg{width:1.1em;height:1.1em;stroke-width:3}
  .hs .hn{font-size:1.15em;font-weight:700;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hs .mb{display:grid;grid-template-columns:1.3em minmax(0,1fr) 2.6em;gap:.45em;align-items:center;font-size:.88em}
  .hs .mb b{text-align:right}
  .hs .mb .tr{height:.55em;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .hs .mb .tr i{display:block;height:100%;width:0;background:var(--pc);border-radius:99px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
  .hs .mb.on b,.hs .mb.on span{color:var(--gold)}
  .hs .mb.out{opacity:.45}
  .hs .hl{order:-2}.hs .hn{order:-1}
  .hs .hp{order:99;margin-top:auto;height:.3em;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden}
  .hs .hp i{display:block;height:100%;width:0;background:rgba(255,255,255,.55);transition:width 1.4s}

<body>
<div class="scr">
  <header class="top">
    <div class="seal" role="img" aria-label="ตราคณะกรรมการนักเรียน โรงเรียนเทพศิรินทร์พุแค สระบุรี"></div>
    <div class="ttl"><b id="eName">การเลือกตั้ง</b><small id="eSub">โรงเรียนเทพศิรินทร์พุแค สระบุรี</small></div>
    <span class="nav hide" id="nav"></span>
    <span class="off hide" id="off">ขาดการเชื่อมต่อ · แสดงข้อมูลล่าสุด</span>

  <main id="main" style="flex:1;display:flex;flex-direction:column"><div class="wait"><div><b>กำลังโหลด…</b></div></div></main>
  <footer class="ft"><span>ผู้พัฒนาระบบ: นายนิมิต ศรีวัฒนะ · โรงเรียนเทพศิรินทร์พุแค สระบุรี</span><span id="upd"></span></footer>
</div>
<div class="tapL" id="tapL"></div><div class="tapR" id="tapR"></div>

<script>
/* =========================================================
   ส่วนที่ 5 : จอแสดงผล
   ========================================================= */
var POLL_MS = 3000, LIVE_MS = 2500, PAGE_MS = { PRES: 16000, HOUSE: 12000, GRID: 20000, LIVE: 18000 };
var S = { data: null, mode: '', pages: [], page: 0, pageAt: 0, paused: false, sig: '', live: null, liveAt: 0, liveSig: '', clSeen: null, calls: [], step: -1 };
var esc = EV.esc, fmt = EV.fmt;
var ST = { SETUP: 'ยังไม่เปิดลงคะแนน', OPEN: 'กำลังเปิดลงคะแนน', PAUSED: 'พักการลงคะแนนชั่วคราว', SEALED: 'ปิดรอบล่วงหน้า (พักหีบ)', CLOSED: 'ปิดลงคะแนนแล้ว' };
var CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function $(id) { return document.getElementById(id); }
function p1(x) { return (Number(x) || 0).toFixed(1).replace(/\.0$/, ''); }

/* ---------- ดึงข้อมูล ---------- */
function poll() {
  if (!EV.ready) { $('main').innerHTML = '<div class="wait"><div><b>ยังไม่ได้ตั้งค่า</b><span>ใส่ลิงก์ /exec ในไฟล์ app.js</span></div></div>'; return; }
  var wait = POLL_MS;
  // โหมดนับสด: ถามกระดานนับสดอย่างเดียว (มีโหมดจอ/สถานะในตัว) · ออกจากโหมดเมื่อผู้ดูแลเปลี่ยนจอ
  var job = S.mode === 'L' ? EV.call('getLive', []).then(function (L) {
    if (L.state === 'HIDDEN' || L.displayMode !== 'LIVE') return pollSummary();
    S.data.status = L.status; S.data.displayMode = L.displayMode;
    gotLive(L); renderLiveMode();
    wait = L.state === 'RUN' ? Math.max(700, Math.min(LIVE_MS, L.nextIn * 1000 + 350)) : LIVE_MS;
  }) : pollSummary();
  job.then(function () { $('off').classList.add('hide'); }, function () { $('off').classList.remove('hide'); })
    .then(function () { setTimeout(poll, wait); });
}
function pollSummary() {
  return EV.call('getPublicSummary', []).then(function (d) {
    S.data = d;
    var needLive = d.status === 'CLOSED' && (d.displayMode === 'LIVE' || (d.displayMode === 'FINAL' && d.liveAlt));
    if (!needLive) { S.live = null; return render(); }
    // ประกาศผลแบบสลับ: กระดานนับสดครบแล้ว ไม่ต้องถามบ่อย
    if (d.displayMode === 'FINAL' && S.live && S.live.state === 'DONE' && Date.now() - S.liveAt < 20000) return render();
    return EV.call('getLive', []).then(function (L) { gotLive(L); render(); });
  });
}
function gotLive(L) {
  var prevStep = S.live ? S.live.step : -1;
  S.live = L; S.liveAt = Date.now();
  S.stepChanged = L.step !== prevStep;
}

function render() {
  var d = S.data;
  $('eName').textContent = d.electionName || 'การเลือกตั้ง';
  $('eSub').textContent = (d.academicYear ? 'ปีการศึกษา ' + d.academicYear + ' · ' : '') + 'โรงเรียนเทพศิรินทร์พุแค สระบุรี';
  $('upd').textContent = d.updatedAt ? 'ปรับปรุงล่าสุด ' + d.updatedAt + ' น.' : '';
  var final = !!d.results;
  if (d.status === 'CLOSED' && d.displayMode === 'LIVE' && S.live) return renderLiveMode();
  S.calls = []; [].forEach.call(document.querySelectorAll('.call,.hcalls'), function (e) { e.remove(); });
  $('spill').className = 'spill ' + (final ? 'FINAL' : d.status);
  $('sText').textContent = final ? 'ประกาศผลการเลือกตั้ง' : d.status === 'OPEN' && d.phase === 'ADV' && (d.schedule || {}).advDate ? 'กำลังเปิดเลือกตั้งล่วงหน้า' : ST[d.status] || d.status;
  if (final) renderFinal(d); else renderTurnout(d);
}

/* ---------- ยอดผู้มาใช้สิทธิ์ ---------- */
var STAT_MS = 15000;
function renderTurnout(d) {
  // หลังปิดหีบ (ยังไม่ประกาศผล): สลับหน้าผู้มาใช้สิทธิ์ กับหน้าสถิติ ทุก 15 วินาที
  var useStats = d.status === 'CLOSED' && d.stats && d.stats.rooms && d.stats.rooms.length;
  if (useStats && Math.floor(Date.now() / STAT_MS) % 2 === 1) return renderStatsPage(d);
  if (S.mode !== 'T') {
    S.mode = 'T'; $('nav').classList.add('hide');
    $('main').innerHTML = '<div class="tgrid">' +
      '<section class="hero"><div class="k">ผู้มาใช้สิทธิ์แล้ว</div><div class="big num" id="tBig">0</div>' +
      '<div class="of">จากผู้มีสิทธิ์ <b class="num" id="tElig">0</b> คน</div>' +
      '<div class="meter"><i id="tBar" style="width:0"></i><span style="left:50%"></span></div>' +
      '<div class="pctrow"><span>ร้อยละของผู้มีสิทธิ์</span><b class="num" id="tPct">0%</b></div>' +
      '<div class="note hide" id="tNote"></div>' +
      '<div class="chips" id="tChips"></div></section>' +
      '<div class="side"><div class="box"><h3><span>แยกตามจุดเลือกตั้ง</span></h3><div id="tSt"></div></div>' +
      '<div class="box"><h3><span>แยกตามคณะสี</span></h3><div id="tHo"></div></div>' +
      '<div class="box"><h3><span>แยกตามระดับชั้น</span></h3><div class="levels" id="tLv"></div></div></div></div>';
  }
  countTo($('tBig'), d.turnout);
  $('tElig').textContent = fmt(d.eligible);
  $('tBar').style.width = Math.min(100, d.turnoutPct || 0) + '%';
  $('tPct').textContent = p1(d.turnoutPct) + '%';
  var sc = d.schedule || {}, two = !!sc.advDate, br = d.byRound || {};
  var note = d.status === 'SETUP' ? (two ? 'เลือกตั้งล่วงหน้า ' + sc.advDateText + ' ที่' + sc.advStationName + ' · เลือกตั้งจริง ' + sc.mainDateText : sc.mainDate ? 'วันเลือกตั้ง ' + sc.mainDateText : 'ยังไม่เปิดลงคะแนน') :
    d.status === 'OPEN' && d.phase === 'ADV' && two ? 'วันเลือกตั้งล่วงหน้า · ใช้สิทธิ์ได้ที่' + sc.advStationName + ' ทุกระดับชั้น' :
    d.status === 'PAUSED' ? 'พักการลงคะแนนชั่วคราว' :
    d.status === 'SEALED' ? 'ปิดรอบเลือกตั้งล่วงหน้าแล้ว · พบกันวันเลือกตั้งจริง ' + (sc.mainDateText || '') :
    d.status === 'CLOSED' ? 'ปิดลงคะแนนแล้ว · รอคณะกรรมการประกาศผล' : '';
  $('tNote').textContent = note; $('tNote').classList.toggle('hide', !note);
  statDots(useStats ? 0 : -1);
  $('tChips').innerHTML =
    (d.status === 'OPEN' ? '<div class="chip"><small>กำลังอยู่ในคูหา</small><b class="num">' + fmt(d.inProgress) + '</b> คน</div>' : '') +
    (two && d.status !== 'SETUP' ? '<div class="chip"><small>ใช้สิทธิ์ล่วงหน้า</small><b class="num">' + fmt(br.ADV || 0) + '</b> คน</div>' : '') +
    (two && (d.phase === 'MAIN' || d.status === 'CLOSED') ? '<div class="chip"><small>ใช้สิทธิ์วันเลือกตั้งจริง</small><b class="num">' + fmt(br.MAIN || 0) + '</b> คน</div>' : '') +
    '<div class="chip"><small>ยังไม่มาใช้สิทธิ์</small><b class="num">' + fmt(Math.max(0, d.eligible - d.turnout - (d.inProgress || 0))) + '</b> คน</div>' +
    (d.paperVoters ? '<div class="chip"><small>ใช้บัตรกระดาษ</small><b class="num">' + fmt(d.paperVoters) + '</b> คน</div>' : '') +
    (d.byType && d.byType.teacher.eligible ? '<div class="chip"><small>ครูมาใช้สิทธิ์</small><b class="num">' + fmt(d.byType.teacher.turnout) + '</b> / ' + fmt(d.byType.teacher.eligible) + ' คน</div>' : '');
  $('tSt').innerHTML = d.byStation.map(function (x) { return rowb(x.name, x.turnout, x.eligible, x.pct, ''); }).join('');
  $('tHo').innerHTML = d.byHouse.map(function (x) { return rowb(x.name, x.turnout, x.eligible, x.pct, x.color); }).join('');
  $('tLv').style.setProperty('--n', d.byLevel.length || 1);
  $('tLv').innerHTML = d.byLevel.map(function (x) {
    return '<div class="lv' + (x.teacher ? ' tch' : '') + '"><span class="p num">' + p1(x.pct) + '%</span><div class="col"><i style="height:' + Math.min(100, x.pct) + '%"></i></div><b>' + esc(x.level) + '</b><small class="num">' + fmt(x.turnout) + '/' + fmt(x.eligible) + '</small></div>';
  }).join('');
}
function statDots(on) {
  var el = $('spg');
  if (on < 0) { if (el) el.remove(); return; }
  if (!el) { el = document.createElement('div'); el.id = 'spg'; el.className = 'spg'; el.innerHTML = '<i></i><i></i>'; $('main').appendChild(el); }
  [].forEach.call(el.children, function (x, i) { x.classList.toggle('on', i === on); });
}
var ROUND_TH = { ADV: 'วันเลือกตั้งล่วงหน้า', MAIN: 'วันเลือกตั้งจริง' };
function hl(h) { return ('0' + h).slice(-2) + '.00'; }
function renderStatsPage(d) {
  var st = d.stats, top = st.rooms.slice(0, 10);
  var sig = JSON.stringify([st.days, top]);
  if (S.mode !== 'TS' || S.statSig !== sig) {
    var fresh = S.mode !== 'TS';
    S.mode = 'TS'; S.statSig = sig; $('nav').classList.add('hide');
    var days = st.days.map(function (dy) {
      return '<div class="sday"><div class="t"><span><b>' + (ROUND_TH[dy.round] ? ROUND_TH[dy.round] + ' · ' : '') + esc(dy.dateText) + '</b></span><span>' + fmt(dy.total) + ' คน · ' + esc(dy.first) + '–' + esc(dy.last) + ' น.</span></div>' +
        '<div class="sch">' + dy.hours.map(function (h) { return '<div class="c' + (h.n === dy.peak.n && h.n ? ' pk' : '') + '"><b class="num">' + (h.n || '') + '</b><i data-h="' + h.n + '" data-m="' + Math.max.apply(null, dy.hours.map(function (x) { return x.n; }).concat([1])) + '" style="height:0"></i></div>'; }).join('') + '</div>' +
        '<div class="sx">' + dy.hours.map(function (h) { return '<span class="num">' + hl(h.h) + '</span>'; }).join('') + '</div></div>';
    }).join('');
    $('main').innerHTML = '<div class="sgrid">' +
      '<section class="sbox"><h3><span>ผู้มาใช้สิทธิ์รายชั่วโมง</span><small>ไม่รวมบัตรกระดาษ</small></h3>' + (days || '<p>ยังไม่มีข้อมูล</p>') +
      '<div class="speak">' + (st.peak ? '<div class="g"><small>ช่วงที่คนแน่นที่สุด</small><b class="num">' + hl(st.peak.h) + '–' + hl(st.peak.h + 1) + '</b> น. · ' + fmt(st.peak.n) + ' คน</div>' : '') +
        '<div><small>ลงคะแนนบนเครื่อง</small><b class="num">' + fmt(st.machine) + '</b> คน</div>' + (st.paper ? '<div><small>บัตรกระดาษ</small><b class="num">' + fmt(st.paper) + '</b> คน</div>' : '') + '</div></section>' +
      '<section class="sbox"><h3><span>ห้องที่มาใช้สิทธิ์มากที่สุด</span><small>10 อันดับแรก</small></h3><div class="srk">' +
        top.map(function (o) { return '<div class="r' + (o.rank === 1 ? ' t1' : '') + (o.eligible && o.voted === o.eligible ? ' full' : '') + '"><span class="k num">' + o.rank + '</span><span class="n">' + esc(o.classroom) + '</span><span class="tr"><i data-w="' + Math.min(100, o.pct) + '" style="width:0"></i></span><span class="p num">' + p1(o.pct) + '%</span></div>'; }).join('') +
      '</div><div class="sfoot">มาใช้สิทธิ์ครบทุกคน <b class="num">' + fmt(st.full) + '</b> ห้อง จาก ' + fmt(st.rooms.length) + ' ห้อง · ปิดลงคะแนนแล้ว รอคณะกรรมการประกาศผล</div></section></div>';
    requestAnimationFrame(function () { requestAnimationFrame(function () {
      [].forEach.call(document.querySelectorAll('.sch i[data-h]'), function (i) { i.style.height = (i.getAttribute('data-h') / i.getAttribute('data-m') * 100) + '%'; });
      [].forEach.call(document.querySelectorAll('.srk i[data-w]'), function (i) { i.style.width = i.getAttribute('data-w') + '%'; });
    }); });
    if (!fresh) return statDots(1);
  }
  $('spill').className = 'spill CLOSED'; $('sText').textContent = 'ปิดลงคะแนนแล้ว';
  statDots(1);
}
function rowb(name, t, e, pct, color) {
  return '<div class="rowb" style="' + (color ? '--c:' + esc(color) : '') + '"><span class="n">' + (color ? '<i></i>' : '') + esc(name) + '</span>' +
    '<span class="tr"><i style="width:' + Math.min(100, pct || 0) + '%"></i></span><span class="v num">' + p1(pct) + '%<small>' + fmt(t) + '/' + fmt(e) + '</small></span></div>';
}
function countTo(el, to) {
  var from = Number(el.getAttribute('data-v') || 0); el.setAttribute('data-v', to);
  if (from === to) { el.textContent = fmt(to); return; }
  var t0 = performance.now(), dur = 900;

    var left = Math.max(0, L.nextIn - Math.floor((Date.now() - S.liveAt) / 1000));
    el.className = 'nx'; el.innerHTML = left > 0 ? 'รายงานถัดไปใน<b>0:' + ('0' + left).slice(-2) + '</b>' : 'กำลังรับผลชุดถัดไป<b>…</b>';
  } else if (L.state === 'PAUSE') { el.className = 'nx'; el.innerHTML = 'คณะกรรมการพักการรายงาน<b>❚❚</b>'; }
  else { el.className = 'nx done'; el.innerHTML = '<b>นับครบทุกหีบ</b>'; }
}
/** ป้ายประกาศ "ชนะแน่นอน" เมื่อเห็นการเปลี่ยนระหว่างนับ (โหลดหน้ามาตอนชนะแล้ว ไม่ขึ้นป้าย) */
function liveCalls(L) {
  var seen = S.clSeen, now = {};
  L.races.forEach(function (r) { now[r.ballot] = r.clinch.state === 'WIN' || r.clinch.state === 'FAIL' ? r.clinch.state + ':' + r.clinch.no : ''; });
  if (seen) L.races.forEach(function (r) {
    if (!now[r.ballot] || now[r.ballot] === seen[r.ballot]) return;
    if (r.ballot === 'PRES') S.calls.push(r); else houseCall(r);     // ประธานนักเรียน = ป้ายเต็มจอ · คณะสี = ป้ายมุมจอ
  });
  S.clSeen = now;
  if (S.calls.length && !q('.call')) showCall();
}
function houseCall(r) {
  var p = r.parties.filter(function (x) { return x.no === r.clinch.no; })[0]; if (!p) return;
  var box = q('.hcalls'); if (!box) { box = document.createElement('div'); box.className = 'hcalls'; document.body.appendChild(box); }
  var el = document.createElement('div'); el.className = 'hcall'; el.style.setProperty('--c', r.color || p.color || '#17603a');
  var win = r.clinch.state === 'WIN';
  el.innerHTML = '<span class="hav"' + (p.photoUrl ? ' style="background-image:url(\'' + esc(p.photoUrl) + '\')"' : '') + '></span><div><small><span class="cb' + (win ? '' : ' fail') + '">' + (win ? 'ชนะแน่นอน' : 'ไม่ถึงกึ่งหนึ่ง') + '</span>' + esc(r.title) + '</small><b>' + esc(pname(p)) + '</b></div>';
  box.appendChild(el);
  setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); }, 500); }, 6000);
}
function showCall() {
  var r = S.calls.shift(); if (!r) return;
  var p = r.parties.filter(function (x) { return x.no === r.clinch.no; })[0]; if (!p) return showCall();
  var win = r.clinch.state === 'WIN', c = p.color || r.color || '#17603a';
  var el = document.createElement('div'); el.className = 'call';
  el.innerHTML = '<div class="cd" style="--c:' + esc(c) + ';--on:' + EV.onColor(c) + '"><div class="cph"' + (p.photoUrl ? ' style="background-image:url(\'' + esc(p.photoUrl) + '\')"' : '') + '>' + (p.photoUrl ? '' : '<span>' + (ini(p) || p.no) + '</span>') + '</div>' +
    '<div class="ctx"><span class="cb' + (win ? '' : ' fail') + '">' + (win ? CHECK + 'ชนะแน่นอน' : 'ไม่ถึงกึ่งหนึ่งแน่นอน') + '</span><div class="cr">' + esc(r.title) + '</div>' +
    '<div class="cn">หมายเลข ' + p.no + ' ' + esc(pname(p)) + '</div><div class="cp">' + esc(pparty(p)) + '</div>' +
    '<div class="cv"><b class="num">' + fmt(p.votes) + '</b> คะแนน · นับแล้ว ' + p1(r.pct) + '% · ' + (win ? 'คะแนนที่เหลือพลิกผลไม่ได้แล้ว' : 'ผลทางการรอคณะกรรมการประกาศ') + '</div></div></div>';
  document.body.appendChild(el);
  setTimeout(function () { el.classList.add('out'); setTimeout(function () { el.remove(); showCall(); }, 500); }, 6500);
}

/* ---------- เปลี่ยนหน้า ---------- */
function go(delta) {
  if (S.mode !== 'F' || S.pages.length < 2) return;
  S.page = (S.page + delta + S.pages.length) % S.pages.length; S.pageAt = Date.now(); showPage();
}
setInterval(function () {
  var t = new Date(); $('clock').textContent = ('0' + t.getHours()).slice(-2) + ':' + ('0' + t.getMinutes()).slice(-2);
  if (S.mode === 'L') liveTick();
  if (S.mode !== 'F' || S.pages.length < 2) { if ($('ptI')) $('ptI').style.width = '0'; return; }
  var dur = PAGE_MS[S.pages[S.page].k], el = Date.now() - S.pageAt;
  if (S.paused) { S.pageAt = Date.now() - Math.min(el, dur); return; }
  if ($('ptI')) $('ptI').style.width = Math.min(100, el / dur * 100) + '%';
  if (el >= dur) go(1);
}, 200);
document.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') go(1);
  else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === ' ') { e.preventDefault(); S.paused = !S.paused; if (S.mode === 'F') showPage(); }
  else if (e.key === 'f' || e.key === 'F') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(function () {}); }
});
$('tapL').onclick = function () { go(-1); };
$('tapR').onclick = function () { go(1); };
poll();
</script>
